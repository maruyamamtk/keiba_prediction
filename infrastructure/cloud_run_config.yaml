# Cloud Run サービス設定
#
# このファイルはCloud Runサービスのデプロイ時に使用される設定を定義します。
# gcloud run deploy コマンドで --flags-file オプションとして使用できます。
#
# 使用例:
#   gcloud run deploy keiba-pipeline --flags-file=infrastructure/cloud_run_config.yaml
#

# サービス基本設定
platform: managed
region: asia-northeast1

# リソース設定
# 予測処理（LightGBM + BigQuery取得）を考慮して 4Gi を確保
# モデル再学習はローカル月次フロー（scripts/monthly_retrain.py）で実行するため Service は 4Gi で十分
memory: 4Gi
cpu: 2
timeout: 900  # 15分（予測処理の長時間実行に対応）

# 同時実行設定
concurrency: 1  # パイプラインは1リクエストずつ処理
min-instances: 0  # アイドル課金ゼロ（コールドスタートを許容）
max-instances: 5  # 日次ジョブ並列実行に対応

# 認証設定
# Cloud Scheduler/内部呼び出しのみ許可
no-allow-unauthenticated: true

# 環境変数
# 機密情報はSecret Managerから取得するため、ここには含めない
# 注意: GCP_PROJECT_IDはデプロイ時に --set-env-vars で指定する必要があります
# 例: gcloud run deploy ... --set-env-vars="GCP_PROJECT_ID=${GCP_PROJECT_ID}"
set-env-vars:
  GCP_REGION: asia-northeast1
  BQ_DATASET_RAW: raw
  BQ_DATASET_FEATURES: features
  BQ_DATASET_PREDICTIONS: predictions
  LOG_LEVEL: INFO
  # GCS_BUCKET_RAW, GCS_BUCKET_MODELS, GCP_PROJECT_ID はデプロイ時に --set-env-vars で指定

# Secret Managerからの環境変数
# フォーマット: ENV_VAR=SECRET_NAME:VERSION
set-secrets:
  JRDB_USER: jrdb-user:latest
  JRDB_PASSWORD: jrdb-password:latest
