# LightGBM LambdaRank モデル設定
# ラベル: 二値（3着以内=1, それ以外=0）でランク学習
model:
  # LightGBMパラメータ
  params:
    objective: "lambdarank"
    metric: "ndcg"
    ndcg_eval_at:
      - 3
    boosting_type: "gbdt"
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    verbose: -1
    seed: 42

  # 学習設定
  training:
    num_boost_round: 1000
    early_stopping_rounds: 50
    log_evaluation: 100
    validation_months: 6

# データ設定
data:
  # BigQuery
  project_id: null  # 環境変数 GCP_PROJECT_ID から取得
  dataset: "features"
  table: "training_data"

  # ラベル・グループ
  label_column: "finish_position"
  group_column: "race_id"
  date_column: "race_date"

  # 除外カラム（特徴量として使用しない）
  exclude_columns:
    - "race_id"
    - "horse_id"
    - "race_date"
    - "target_place"
    - "finish_position"
    - "venue_code"
    - "jockey_id"
    - "trainer_id"
    - "created_at"
    - "race_number"

  # カテゴリカル特徴量
  categorical_columns:
    - "course_type"
    - "track_condition"
    - "direction"
    - "age_condition"
    - "race_class"
    - "blinker"
    - "pace_forecast"
    - "trainer_affiliation"

# GCS設定
gcs:
  bucket_suffix: "keiba-models"
  model_prefix: "lgbm_ranker_multi"

# チューニング設定（Optuna）
# 汎用設定（全モデル共通）。各モデル種別サブセクションで study_name 等を上書き可能。
tuning:
  n_trials: 100
  timeout: 3600  # 秒
  study_name: "keiba_lgbm_ranker"
  storage: null  # null=in-memory, or "sqlite:///optuna.db"

  # 探索範囲
  search_space:
    num_leaves:
      type: int
      low: 15
      high: 127
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    feature_fraction:
      type: float
      low: 0.4
      high: 1.0
    bagging_fraction:
      type: float
      low: 0.4
      high: 1.0
    bagging_freq:
      type: int
      low: 1
      high: 10
    min_child_samples:
      type: int
      low: 5
      high: 100
    reg_alpha:
      type: float
      low: 1.0e-8
      high: 10.0
      log: true
    reg_lambda:
      type: float
      low: 1.0e-8
      high: 10.0
      log: true

# 評価設定
evaluation:
  metrics:
    - "ndcg@3"
    - "recall@3"
    - "auc"

